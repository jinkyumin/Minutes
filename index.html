<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Notes</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <h1>Meeting Notes</h1>
        </div>
        <div class="header-status" aria-live="polite">
          <span id="stage" class="stage-pill">현재 단계: 회의 정보 입력</span>
          <span class="status-pill"><span class="status-dot"></span><strong id="status">대기 중</strong></span>
          <span class="status-pill"><strong id="meetingDuration">00:00</strong></span>
        </div>
      </header>

      <section id="supportNotice" class="notice" hidden>
        이 브라우저는 회의 녹음을 지원하지 않습니다. Chrome 또는 Edge에서 실행해주세요.
      </section>

      <section id="appGrid" class="app-grid">
        <aside class="panel history-panel">
          <button id="openHistoryButton" class="history-open-button" type="button" title="회의록 목록 열기">열기</button>
          <div class="panel-title-bar">
            <h2 class="history-content">회의록 목록</h2>
            <button id="toggleHistoryButton" class="collapse-button" type="button" title="회의록 목록 숨기기">‹</button>
          </div>
          <div class="panel-body history-content">
            <ol id="historyList" class="history-list">
              <li class="empty-state">저장된 회의록이 없습니다.</li>
            </ol>
          </div>
        </aside>

        <article class="panel">
          <div class="panel-title-bar">
            <h2>회의 준비</h2>
            <button id="newMeetingButton" type="button">새 회의</button>
          </div>

          <div class="panel-body">
            <section class="meeting-fields" aria-label="회의 기본 정보">
              <label class="full-field">
                회의록 제목
                <input id="meetingTitle" placeholder="예: SAP 퍼블릭 검토 회의" />
              </label>
              <label>
                회의 일시
                <input id="meetingDateTime" type="datetime-local" />
              </label>
              <label>
                참석자
                <input id="attendees" placeholder="예: 김민수, 이지연" />
              </label>
            </section>

            <div id="readyControls" class="ready-controls" aria-label="회의 제어">
              <button id="startButton" class="primary" type="button">회의 시작</button>
              <button id="uploadAudioButton" type="button">음성 파일 업로드</button>
              <input id="audioFileInput" class="file-input" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.mp4" />
            </div>

            <section id="recordingPanel" class="recording-card" aria-label="회의 녹음 상태" hidden>
              <div class="recording-timer">
                <span class="record-dot"></span>
                <span id="recordingTimerText">00:00</span>
              </div>

              <div class="recording-dock">
                <button id="pauseButton" class="pause-button" type="button" disabled aria-label="일시정지">
                  <span class="pause-icon" aria-hidden="true"><span></span><span></span></span>
                  <span class="pause-text">일시정지</span>
                </button>
                <div id="waveform" class="waveform" aria-hidden="true"></div>
                <button id="endButton" class="end-button" type="button" disabled>End</button>
              </div>

              <p id="recordingMessage" class="recording-message">
                녹음 파일을 저장 중입니다.
              </p>
            </section>

            <label class="note-field">
              Note
              <textarea
                id="note"
                placeholder="회의 중 남길 메모나 외부 전사 텍스트를 입력하세요."
              ></textarea>
              <span>입력한 내용은 회의 종료 후 요약에 함께 반영됩니다.</span>
            </label>
          </div>
        </article>

        <aside class="panel result-panel">
          <div class="panel-title-bar">
            <h2>회의 결과</h2>
          </div>

          <div class="panel-body">
            <div id="summarySections" class="summary-sections">
              <section class="summary-section">
                <h3>회의 요약</h3>
                <p id="summaryOverview" class="summary-overview guidance-text">회의 종료 후 요약이 표시됩니다.</p>
              </section>
            </div>

            <div class="result-actions">
              <button id="copySummaryButton" type="button">회의록 복사</button>
              <button id="downloadPdfButton" type="button">PDF 다운로드</button>
              <button id="sendNotionButton" class="notion" type="button" disabled>Notion으로 보내기</button>
              <button id="notionSettingsButton" class="icon-button" type="button" aria-label="Notion 설정" title="Notion 설정">⚙</button>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <dialog id="notionDialog" class="settings-dialog">
      <form method="dialog">
        <div class="panel-header">
          <h2>Notion 설정</h2>
          <button class="icon-button" value="cancel" type="submit" aria-label="닫기">×</button>
        </div>
        <label>
          Database ID
          <input id="notionDatabaseId" placeholder="Notion database ID" />
        </label>
        <p class="dialog-help">Notion Token은 Vercel 환경변수에 저장하고, 이곳에는 Database ID만 저장합니다.</p>
        <div class="dialog-actions">
          <button id="testNotionButton" type="button">연결 테스트</button>
          <button id="saveNotionSettingsButton" class="primary" value="default" type="button">저장</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
